# Servicios de desarrollo. La app corre en el host con `php artisan serve`.
# Docker Compose lee las variables DB_* del .env de este mismo directorio.
name: laravel-store
services:
    mysql:
        container_name: laravel-store-mysql
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        ports:
            - "127.0.0.1:${DB_PORT}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            retries: 10

    adminer:
        container_name: laravel-store-adminer
        image: adminer:latest
        environment:
            ADMINER_DEFAULT_SERVER: mysql
        ports:
            - "127.0.0.1:8080:8080"
        depends_on:
            - mysql

volumes:
    mysql-data:
